name: Deploy RXN3D Frontend

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Prevent two production deployments from running at the same time.
# A new deployment waits for the previous one to finish.
concurrency:
  group: rxn3d-frontend-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy Production
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. Checkout
      # ========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================================
      # 2. Setup Node
      # ========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ========================================
      # 3. Cache node_modules
      #
      # Skips the install step entirely on a lockfile-hash
      # cache hit instead of just caching npm's download cache.
      # ========================================
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}

      # ========================================
      # 4. Cache Next.js build cache
      #
      # Lets Next.js do incremental compilation instead of
      # rebuilding everything from scratch every run.
      # ========================================
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # ========================================
      # 5. Install dependencies
      # ========================================
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      # ========================================
      # 6. Build Next.js (standalone output)
      #
      # Requires `output: 'standalone'` in next.config.js
      # ========================================
      - name: Build Next.js
        run: |
          echo "========================================"
          echo "Starting Next.js production build"
          echo "========================================"

          date

          NODE_ENV=production npm run build

          date

          echo "========================================"
          echo "Next.js build completed"
          echo "========================================"

      # ========================================
      # 7. Prepare release (standalone layout)
      #
      # .next/standalone contains server.js + a trimmed
      # node_modules, but does NOT include static assets or
      # public/ nested inside it — those have to be copied in
      # manually.
      # ========================================
      - name: Prepare release
        run: |
          set -e

          rm -rf release
          mkdir -p release

          echo "Copying standalone server + bundled deps..."

          cp -r .next/standalone/. release/

          echo "Copying static assets..."

          mkdir -p release/.next/static
          cp -r .next/static/. release/.next/static/

          echo "Copying public..."

          if [ -d "public" ]; then
            mkdir -p release/public
            cp -r public/. release/public/
          fi

          echo ""
          echo "Release size:"
          du -sh release

          echo ""
          echo "server.js present:"
          ls -la release/server.js

      # ========================================
      # 8. Create release archive
      # ========================================
      - name: Create release archive
        run: |
          set -e

          tar -czf "rxn3d-frontend-${{ github.sha }}.tar.gz" \
            -C release .

          echo "Release archive:"
          ls -lh "rxn3d-frontend-${{ github.sha }}.tar.gz"

      # ========================================
      # 9. Configure SSH
      # ========================================
      - name: Configure SSH
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan \
            -p "${{ secrets.SERVER_PORT }}" \
            -H "${{ secrets.SERVER_HOST }}" \
            >> ~/.ssh/known_hosts

      # ========================================
      # 10. Upload release to EC2
      # ========================================
      - name: Upload release to server
        run: |
          set -e

          scp \
            -i ~/.ssh/id_rsa \
            -P "${{ secrets.SERVER_PORT }}" \
            "rxn3d-frontend-${{ github.sha }}.tar.gz" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/rxn3d-frontend-${{ github.sha }}.tar.gz"

      # ========================================
      # 11. Deploy release on EC2
      # ========================================
      - name: Deploy release
        run: |
          set -e

          ssh \
            -i ~/.ssh/id_rsa \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "cd /var/www/rxn3d/frontend && ./deploy.sh --artifact /tmp/rxn3d-frontend-${{ github.sha }}.tar.gz"

      # ========================================
      # 12. Cleanup local SSH key
      # ========================================
      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa