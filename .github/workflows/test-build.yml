name: Test Next.js Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Next.js Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: |
          time npm run build

      - name: Prepare release
        run: |
          mkdir release

          cp -r .next release/.next
          cp -r public release/public
          cp package.json release/package.json
          cp package-lock.json release/package-lock.json

      - name: Create release archive
        run: |
          tar -czf rxn3d-frontend.tar.gz -C release .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: rxn3d-frontend-release
          path: rxn3d-frontend.tar.gz
          retention-days: 1
